upstream daphne {
    server 127.0.0.1:8000;
}

server {
    listen 8080;
    server_name pgflow.online www.pgflow.online _;

    client_max_body_size 10M;

    # Serve the React Frontend
    location / {
        root /var/www/attendance_app/frontend/dist;
        index index.html;
        try_files $uri $uri/ /index.html;
    }

    # Proxy WebSockets to Django/Daphne
    location /ws/ {
        proxy_pass http://daphne;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 86400;
        proxy_send_timeout 86400;
    }

    # Proxy API and Admin to Django
    location ~ ^/(api|admin) {
        proxy_pass http://daphne;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_redirect off;
    }

    # Django Static Files
    location /static/ {
        alias /var/www/attendance_app/backend/staticfiles/;
        expires 30d;
        add_header Cache-Control "public, immutable";
    }

    # Django Media Files
    location /media/ {
        alias /var/www/attendance_app/backend/media/;
        expires 7d;
    }
}
