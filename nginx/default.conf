upstream daphne {
    server backend:8000;
}

# HTTP Server - ACME Challenge & HTTP-to-HTTPS Redirection
server {
    listen 80;
    server_name pgflow.online www.pgflow.online;

    # Certbot ACME Challenge Path
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    # Redirect all other HTTP traffic to HTTPS
    location / {
        return 301 https://$host$request_uri;
    }
}

# HTTPS Server - Production SSL & Reverse Proxy
server {
    listen 443 ssl http2;
    listen 8080 ssl;
    server_name pgflow.online www.pgflow.online _;

    # Let's Encrypt SSL Certificates
    ssl_certificate /etc/letsencrypt/live/pgflow.online/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/pgflow.online/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;
    ssl_prefer_server_ciphers on;

    client_max_body_size 50M;

    # ACME Challenge on SSL as well if needed
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    # Serve the React Frontend from the frontend container
    location / {
        proxy_pass http://frontend:80;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
    }

    # Proxy WebSockets to Django/Daphne
    location /ws/ {
        proxy_pass http://daphne;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_read_timeout 86400;
        proxy_send_timeout 86400;
    }

    # Proxy API and Admin to Django
    location ~ ^/(api|admin) {
        proxy_pass http://daphne;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_redirect off;
    }

    # Django Static Files
    location /static/ {
        alias /app/staticfiles/;
        expires 30d;
        add_header Cache-Control "public, immutable";
    }

    # Django Media Files
    location /media/ {
        alias /app/media/;
        expires 7d;
    }
}
