name: CI/CD Pipeline

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ============================================================================
  # 1. Backend Validation & Automated Testing
  # ============================================================================
  backend-validation:
    name: Backend CI (Django & Tests)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python 3.10
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          cache: 'pip'
          cache-dependency-path: 'backend/requirements.txt'

      - name: Install Backend Dependencies
        working-directory: ./backend
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Verify Django Settings & System Checks
        working-directory: ./backend
        run: |
          python manage.py check

      - name: Check for Pending Database Migrations
        working-directory: ./backend
        run: |
          python manage.py makemigrations --check --dry-run

      - name: Run Backend Test Suite
        working-directory: ./backend
        run: |
          python manage.py test

  # ============================================================================
  # 2. Frontend Validation & Production Build
  # ============================================================================
  frontend-validation:
    name: Frontend CI (Vite & React Build)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Node.js 18
        uses: actions/setup-node@v4
        with:
          node-version: 18
          cache: 'npm'
          cache-dependency-path: 'frontend/package-lock.json'

      - name: Install Frontend Dependencies
        working-directory: ./frontend
        run: |
          npm install

      - name: Build Production Frontend Bundle
        working-directory: ./frontend
        env:
          VITE_API_URL: https://api.production.placeholder
        run: |
          npm run build

  # ============================================================================
  # 3. Continuous Deployment (Hostinger VPS)
  # ============================================================================
  deploy-production:
    name: Deploy to Hostinger VPS
    needs: [backend-validation, frontend-validation]
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'

    steps:
      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.HOSTINGER_HOST }}
          username: ${{ secrets.HOSTINGER_USER }}
          key: ${{ secrets.HOSTINGER_SSH_KEY }}
          port: ${{ secrets.HOSTINGER_PORT || 22 }}
          timeout: 180s
          command_timeout: 30m
          script: |
            echo "==========================================================="
            echo "Pulling latest code and rebuilding on Hostinger VPS..."
            echo "==========================================================="
            cd /var/www/attendance_app
            git fetch origin main
            git reset --hard origin/main
            chmod +x deploy_host_nginx.sh
            bash deploy_host_nginx.sh || true
            docker compose build frontend backend
            docker compose up -d --force-recreate
            echo "Deployment completed successfully!"
