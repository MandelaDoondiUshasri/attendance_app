server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Ensure CSS and JS are served with correct MIME types
    include /etc/nginx/mime.types;

    # Serve static assets directly and return 404 if missing (prevents MIME type errors)
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
