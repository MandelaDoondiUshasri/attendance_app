<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 460 100" width="100%" height="100%">
  <defs>
    <!-- Main Gradient -->
    <linearGradient id="logo-stroke1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#6366f1" />
    </linearGradient>
    <linearGradient id="logo-stroke2" x1="100%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#a855f7" />
      <stop offset="100%" stop-color="#06b6d4" />
    </linearGradient>
    <linearGradient id="x-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#06b6d4" />
      <stop offset="50%" stop-color="#3b82f6" />
      <stop offset="100%" stop-color="#a855f7" />
    </linearGradient>
  </defs>

  <!-- Icon Section -->
  <g transform="translate(10, 10)">
    <!-- Squircle Backdrop -->
    <rect width="80" height="80" rx="22" fill="#0b1120" stroke="#1e293b" stroke-width="2" />
    
    <!-- Outer Glow Orbit -->
    <circle cx="40" cy="40" r="32" fill="none" stroke="#334155" stroke-width="1" stroke-dasharray="3 5" opacity="0.6" />
    
    <!-- AttendX Glyph -->
    <path d="M 58 22 L 22 58" stroke="url(#logo-stroke1)" stroke-width="8" stroke-linecap="round" />
    <path d="M 22 22 L 58 58" stroke="url(#logo-stroke2)" stroke-width="8" stroke-linecap="round" />
    <path d="M 27 40 L 53 40" stroke="#ffffff" stroke-width="4" stroke-linecap="round" opacity="0.95" />
    <circle cx="40" cy="40" r="5" fill="#38bdf8" />
    
    <!-- Green Verification Dot -->
    <circle cx="58" cy="58" r="6" fill="#10b981" stroke="#0b1120" stroke-width="2" />
  </g>

  <!-- Typography Section -->
  <!-- "ATTEND" in Crisp Modern Bold White -->
  <text x="106" y="58" 
        font-family="system-ui, -apple-system, 'Inter', 'Segoe UI', Roboto, sans-serif" 
        font-size="42" 
        font-weight="900" 
        letter-spacing="4" 
        fill="#ffffff">ATTEND</text>

  <!-- "X" in Vibrant Gradient with Forward Motion -->
  <text x="324" y="58" 
        font-family="system-ui, -apple-system, 'Inter', 'Segoe UI', Roboto, sans-serif" 
        font-size="46" 
        font-weight="900" 
        fill="url(#x-grad)">X</text>

  <!-- Subtitle Tagline -->
  <text x="108" y="78" 
        font-family="system-ui, -apple-system, 'Inter', 'Segoe UI', Roboto, sans-serif" 
        font-size="10.5" 
        font-weight="700" 
        letter-spacing="3.2" 
        fill="#94a3b8">ENTERPRISE ATTENDANCE SUITE</text>
</svg>
